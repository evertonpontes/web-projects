<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <form class="container__form">
        <div class="field form__field">
          <label class="field__label" for="name">Full Name</label>
          <input
            class="field__input"
            name="name"
            id="name"
            type="text"
            placeholder="Enter your full name"
          />
        </div>

        <div class="field form__field">
          <label class="field__label" for="email">Email</label>
          <input
            class="field__input"
            name="email"
            id="email"
            type="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="field form__field">
          <label class="field__label" for="password">Enter Password</label>
          <div class="field__input field__input--password">
            <input
              class="field__input"
              name="password"
              id="password"
              type="password"
              placeholder="xxxxxxxx"
            />

            <button type="button" class="field__icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path
                  d="M12.0003 3C17.3924 3 21.8784 6.87976 22.8189 12C21.8784 17.1202 17.3924 21 12.0003 21C6.60812 21 2.12215 17.1202 1.18164 12C2.12215 6.87976 6.60812 3 12.0003 3ZM12.0003 19C16.2359 19 19.8603 16.052 20.7777 12C19.8603 7.94803 16.2359 5 12.0003 5C7.7646 5 4.14022 7.94803 3.22278 12C4.14022 16.052 7.7646 19 12.0003 19ZM12.0003 16.5C9.51498 16.5 7.50026 14.4853 7.50026 12C7.50026 9.51472 9.51498 7.5 12.0003 7.5C14.4855 7.5 16.5003 9.51472 16.5003 12C16.5003 14.4853 14.4855 16.5 12.0003 16.5ZM12.0003 14.5C13.381 14.5 14.5003 13.3807 14.5003 12C14.5003 10.6193 13.381 9.5 12.0003 9.5C10.6196 9.5 9.50026 10.6193 9.50026 12C9.50026 13.3807 10.6196 14.5 12.0003 14.5Z"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="field form__field">
          <label class="field__label" for="confirm-password"
            >Confirm Password</label
          >
          <div class="field__input field__input--password">
            <input
              class="field__input"
              name="confirm-password"
              id="confirm-password"
              type="password"
              placeholder="xxxxxxxx"
            />

            <button type="button" class="field__icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path
                  d="M12.0003 3C17.3924 3 21.8784 6.87976 22.8189 12C21.8784 17.1202 17.3924 21 12.0003 21C6.60812 21 2.12215 17.1202 1.18164 12C2.12215 6.87976 6.60812 3 12.0003 3ZM12.0003 19C16.2359 19 19.8603 16.052 20.7777 12C19.8603 7.94803 16.2359 5 12.0003 5C7.7646 5 4.14022 7.94803 3.22278 12C4.14022 16.052 7.7646 19 12.0003 19ZM12.0003 16.5C9.51498 16.5 7.50026 14.4853 7.50026 12C7.50026 9.51472 9.51498 7.5 12.0003 7.5C14.4855 7.5 16.5003 9.51472 16.5003 12C16.5003 14.4853 14.4855 16.5 12.0003 16.5ZM12.0003 14.5C13.381 14.5 14.5003 13.3807 14.5003 12C14.5003 10.6193 13.381 9.5 12.0003 9.5C10.6196 9.5 9.50026 10.6193 9.50026 12C9.50026 13.3807 10.6196 14.5 12.0003 14.5Z"
                ></path>
              </svg>
            </button>
          </div>
        </div>

        <input
          class="submit-btn form__submit"
          type="submit"
          value="Update Profile"
        />
      </form>

      <div class="state container__state">
        <div class="progress-bar state__progress-bar">
          <span class="progress-bar__percent"></span>
        </div>

        <p>Profile Completeness</p>

        <div class="state__check-list">
          <ul class="list">
            <li class="list__item">Create Account</li>
            <li class="list__item">Update Roadmap Progress</li>
            <li class="list__item">Setup Public Profile</li>
            <li class="list__item">Complete Your First Project</li>
            <li class="list__item">Invite Yout Friends</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
