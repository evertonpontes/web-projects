<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datepicker UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="input-section">
        <input class="input-date" id="input-date" placeholder="dd/mm/yyyy" />
        <button class="toggle-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path fill="none" d="M0 0h24v24H0z"></path>
            <path
              d="M9 1V3H15V1H17V3H21C21.5523 3 22 3.44772 22 4V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V4C2 3.44772 2.44772 3 3 3H7V1H9ZM20 11H4V19H20V11ZM8 13V15H6V13H8ZM13 13V15H11V13H13ZM18 13V15H16V13H18ZM7 5H4V9H20V5H17V7H15V5H9V7H7V5Z"
            ></path>
          </svg>
        </button>
      </div>
      <div class="calendar-section">
        <div class="calendar__header">
          <div class="calendar__header__nav">
            <button class="nav__button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path d="M8 12L14 6V18L8 12Z"></path>
              </svg>
            </button>
            <span class="month-year">September 2026</span>
            <button class="nav__button">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path d="M16 12L10 18V6L16 12Z"></path>
              </svg>
            </button>
          </div>
          <div class="calendar__header__weekdays">
            <ul>
              <li class="weekday">S</li>
              <li class="weekday">M</li>
              <li class="weekday">T</li>
              <li class="weekday">W</li>
              <li class="weekday">T</li>
              <li class="weekday">F</li>
              <li class="weekday">S</li>
            </ul>
          </div>
        </div>
        <div class="calendar__days">
          <ul class="week">
            <li class="day">30</li>
            <li class="day">31</li>
            <li class="day">1</li>
            <li class="day">2</li>
            <li class="day">3</li>
            <li class="day">4</li>
            <li class="day">5</li>
          </ul>
          <ul class="week">
            <li class="day">6</li>
            <li class="day">7</li>
            <li class="day">8</li>
            <li class="day">9</li>
            <li class="day">10</li>
            <li class="day">11</li>
            <li class="day">12</li>
          </ul>
          <ul class="week">
            <li class="day">13</li>
            <li class="day">14</li>
            <li class="day">15</li>
            <li class="day">16</li>
            <li class="day">17</li>
            <li class="day">18</li>
            <li class="day">19</li>
          </ul>
          <ul class="week">
            <li class="day">20</li>
            <li class="day">21</li>
            <li class="day">22</li>
            <li class="day">23</li>
            <li class="day">24</li>
            <li class="day">25</li>
            <li class="day">26</li>
          </ul>
          <ul class="week">
            <li class="day">27</li>
            <li class="day">28</li>
            <li class="day">29</li>
            <li class="day">30</li>
            <li class="day">1</li>
            <li class="day">2</li>
            <li class="day">3</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
